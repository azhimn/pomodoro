<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icons: Phosphor (https://phosphoricons.com), MIT license -->
  <header>
    <button id="toggle-todos" class="icon" aria-label="Show to-do list" aria-pressed="false">
      <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM117.66,149.66l-32,32a8,8,0,0,1-11.32,0l-16-16a8,8,0,0,1,11.32-11.32L80,164.69l26.34-26.35a8,8,0,0,1,11.32,11.32Zm0-64-32,32a8,8,0,0,1-11.32,0l-16-16A8,8,0,0,1,69.66,90.34L80,100.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM192,168H144a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Zm0-64H144a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Z"/></svg>
    </button>
    <button id="open-settings" class="icon" aria-label="Settings">
      <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M237.94,107.21a8,8,0,0,0-3.89-5.4l-29.83-17-.12-33.62a8,8,0,0,0-2.83-6.08,111.91,111.91,0,0,0-36.72-20.67,8,8,0,0,0-6.46.59L128,41.85,97.88,25a8,8,0,0,0-6.47-.6A111.92,111.92,0,0,0,54.73,45.15a8,8,0,0,0-2.83,6.07l-.15,33.65-29.83,17a8,8,0,0,0-3.89,5.4,106.47,106.47,0,0,0,0,41.56,8,8,0,0,0,3.89,5.4l29.83,17,.12,33.63a8,8,0,0,0,2.83,6.08,111.91,111.91,0,0,0,36.72,20.67,8,8,0,0,0,6.46-.59L128,214.15,158.12,231a7.91,7.91,0,0,0,3.9,1,8.09,8.09,0,0,0,2.57-.42,112.1,112.1,0,0,0,36.68-20.73,8,8,0,0,0,2.83-6.07l.15-33.65,29.83-17a8,8,0,0,0,3.89-5.4A106.47,106.47,0,0,0,237.94,107.21ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z"/></svg>
    </button>
  </header>

  <main>
    <div id="time" role="timer" aria-live="off">25:00</div>
    <div id="step">Work 1/4 · Cycle 1</div>
    <nav class="controls">
      <button id="prev" class="icon" aria-label="Previous step">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M208,47.88V208.12a16,16,0,0,1-24.43,13.43L64,146.77V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0v69.23L183.57,34.45A15.95,15.95,0,0,1,208,47.88Z"/></svg>
      </button>
      <button id="toggle" class="icon" aria-label="Start">
        <svg class="i-play" viewBox="0 0 256 256" aria-hidden="true"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg>
        <svg class="i-pause" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/></svg>
      </button>
      <button id="next" class="icon" aria-label="Next step">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M208,40V216a8,8,0,0,1-16,0V146.77L72.43,221.55A15.95,15.95,0,0,1,48,208.12V47.88A15.95,15.95,0,0,1,72.43,34.45L192,109.23V40a8,8,0,0,1,16,0Z"/></svg>
      </button>
    </nav>

    <section id="todos" hidden aria-label="To-do list">
      <form id="todo-add"><input name="text" placeholder="Add a task" maxlength="200" required aria-label="New task" autocomplete="off"></form>
      <ul id="todo-list"></ul>
    </section>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="dialog-head">
        <h2 id="settings-title">Settings</h2>
        <button class="icon" aria-label="Close settings">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg>
        </button>
      </div>
      <label>Work/break pairs per cycle <input type="number" name="cycle" min="1" max="12" step="1" required></label>
      <fieldset><legend>Button sounds (Hz)</legend>
        <label>Continue <input type="number" name="sound.resume" min="100" max="4000" step="10" required></label>
        <label>Pause <input type="number" name="sound.pause" min="100" max="4000" step="10" required></label>
        <label>Prev / next <input type="number" name="sound.skip" min="100" max="4000" step="10" required></label>
      </fieldset>
      <fieldset class="wide"><legend>Font</legend>
        <label>Preset
          <select name="font">
            <option value="system-ui, sans-serif">System</option>
            <option value="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Quicksand', system-ui, sans-serif">Rounded</option>
            <option value="'Seravek', 'Gill Sans', 'Ubuntu', 'Segoe UI', 'Noto Sans', sans-serif">Humanist</option>
            <option value="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif">Serif</option>
            <option value="ui-monospace, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace">Monospace</option>
          </select>
        </label>
        <label>Or any installed font <input name="fontCustom" maxlength="100" placeholder="e.g. Inter" autocomplete="off"></label>
      </fieldset>
      <fieldset class="wide data"><legend>Data</legend>
        <button type="button" id="todo-export">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40A8,8,0,0,0,168,96H136V32a8,8,0,0,0-16,0V96H88a8,8,0,0,0-5.66,13.66Z"/></svg>
          Export tasks (.md)
        </button>
        <button type="button" id="todo-import">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM88,80h32v64a8,8,0,0,0,16,0V80h32a8,8,0,0,0,5.66-13.66l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,88,80Z"/></svg>
          Import tasks (.md)
        </button>
        <button type="button" id="settings-export">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40A8,8,0,0,0,168,96H136V32a8,8,0,0,0-16,0V96H88a8,8,0,0,0-5.66,13.66Z"/></svg>
          Export settings (.json)
        </button>
        <button type="button" id="settings-import">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM88,80h32v64a8,8,0,0,0,16,0V80h32a8,8,0,0,0,5.66-13.66l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,88,80Z"/></svg>
          Import settings (.json)
        </button>
        <input id="todo-file" type="file" accept=".md,text/markdown,text/plain" hidden>
        <input id="settings-file" type="file" accept=".json,application/json" hidden>
      </fieldset>
      <button class="close">Done</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
